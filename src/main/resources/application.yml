spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: EXE_project
  data:
    mongodb:
      database: ${MONGO_DATABASE:EXE_project}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mongo:
    database: ${MONGO_DATABASE:EXE_project}
    root-username: ${MONGO_ROOT_USERNAME:}
    root-password: ${MONGO_ROOT_PASSWORD:}
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    auth-database: ${MONGO_AUTH_DATABASE:admin}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/vnpay-return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}

logging:
  level:
    org.springframework.security: INFO
