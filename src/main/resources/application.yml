spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: EXE_project
  data:
    mongodb:
      database: ${MONGO_DATABASE:EXE_project}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mongo:
    database: ${MONGO_DATABASE:EXE_project}
    root-username: ${MONGO_ROOT_USERNAME:}
    root-password: ${MONGO_ROOT_PASSWORD:}
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    auth-database: ${MONGO_AUTH_DATABASE:admin}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/momo-result}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    lang: ${MOMO_LANG:vi}
    simulator-enabled: ${MOMO_SIMULATOR_ENABLED:false}
    simulator-url: ${MOMO_SIMULATOR_URL:http://localhost:3000/momo-simulator}

logging:
  level:
    org.springframework.security: INFO
